<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="img/Neon Purple MkeWeTok Crown Logo.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>MkeWeTok</title>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7 col-xl-6">
                <div class="card app-card">
                    <div class="card-header-custom">
                        <h2><i class="fa-solid fa-comment-dots me-2"></i>MkeWeTok</h2>
                        <p class="mb-0 small opacity-80">Type, translate, and listen</p>
                    </div>
                    <div class="card-body p-4">
                        <div class="row mb-3">
                            <div class="col-12 col-md-8">
                                <select id="languageSelect" class="form-select form-select-sm">
                                    <option value="en">🇺🇸 English</option>
                                    <option value="es">🇪🇸 Spanish</option>
                                    <option value="fr">🇫🇷 French</option>
                                    <option value="de">🇩🇪 German</option>
                                    <option value="zh">🇨🇳 Chinese (Simplified)</option>
                                    <option value="ja">🇯🇵 Japanese</option>
                                    <option value="ar">🇸🇦 Arabic</option>
                                    <option value="hi">🇮🇳 Hindi</option>
                                    <option value="pt">🇵🇹 Portuguese</option>
                                    <option value="ru">🇷🇺 Russian</option>
                                    <option value="it">🇮🇹 Italian</option>
                                    <option value="ko">🇰🇷 Korean</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-4 d-grid">
                                <button id="translateBtn" class="btn btn-outline-primary">
                                    <span class="loading-spinner" id="translateSpinner"></span>
                                    <span id="translateBtnText">Translate</span>
                                </button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="input" class="form-label fw-bold">Enter text</label>
                            <textarea id="input" class="form-control textarea-input" placeholder="Write something here..." autocomplete="off"></textarea>
                        </div>
                        <div class="d-grid mb-4">
                            <button id="speakBtn" class="btn btn-speak" onclick="speakText()">
                                <i class="fa-solid fa-volume-high me-2"></i>📢 Speak Aloud
                            </button>
                        </div>
                        <div id="translatedOutput" class="output-box">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <span class="badge bg-primary lang-badge" id="outputLangBadge">Translated</span>
                                <button id="copyBtn" class="btn btn-sm btn-outline-secondary" onclick="copyTranslation()">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                            </div>
                            <div id="outputText" class="fw-semibold"></div>
                        </div>
                        <div id="statusMsg" class="status-text text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
